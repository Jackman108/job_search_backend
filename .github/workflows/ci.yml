name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: lint · format · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Structure (≤300 lines)
        run: yarn check:structure

      - name: Modules boundaries (enforce)
        run: yarn check:modules

      - name: Env example sync (E8)
        run: yarn check:env-examples --enforce

      - name: OpenAPI export drift (E4)
        run: yarn openapi:check

  e2e-cross:
    name: e2e cross (optional stack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Cross-service smoke (skips if auth/backend not running)
        run: yarn e2e
        env:
          AUTH_URL: http://localhost:8001/api
          API_URL: http://localhost:8000
