# DEPRECATED for day-to-day use.
# Prefer repo-root: docker/docker-compose.yml via .\dev-docker.ps1
# (containers: job_search_postgres, job_search_redis, job_search_pgadmin).
#
# Kept so older `npm run docker:up` paths still work. Same image/ports as root.

services:
  postgres:
    container_name: job_search_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-job_search}
    volumes:
      - job_search_postgres_data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    networks:
      - job_search_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-job_search}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    container_name: job_search_pgadmin
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - job_search_pgadmin_data:/var/lib/pgadmin
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    networks:
      - job_search_net
    restart: unless-stopped

networks:
  job_search_net:
    driver: bridge

volumes:
  job_search_postgres_data:
  job_search_pgadmin_data:
